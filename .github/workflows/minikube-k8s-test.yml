# This is a basic workflow to help you get started with Actions

name: Test minikube script (k8s)

# Controls when the workflow will run
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test-minikube-build:
    name: Test with minikube (build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Start minikube
        uses: medyagh/setup-minikube@e54c6bfce85fe75714fc113f1fa200c23338732b # master@2026-07-22
        with:
          minikube-version: 1.38.1
          driver: docker
          kubernetes-version: v1.32.0
      - name: test script
        run: |
          ./build-and-deploy.sh
          kubectl wait --for=condition=ready pod -l app=wrongsecrets-balancer --timeout=300s
          kubectl logs deployments/wrongsecrets-balancer -f >> pod.log &
          echo "port forwarding"
          kubectl port-forward service/wrongsecrets-balancer 3000:3000 &
          echo "Awaiting the first forward to be ready"
          sleep 10
          curl http://localhost:3000/balancer/
          echo "logs from pod to make sure:"
          cat pod.log
      - name: Show pod diagnostics on failure
        if: failure()
        run: |
          kubectl describe pods -l app=wrongsecrets-balancer
          kubectl get events --sort-by='.lastTimestamp'
  test-minikube-containers:
    name: Test with minikube (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Start minikube
        uses: medyagh/setup-minikube@e54c6bfce85fe75714fc113f1fa200c23338732b # master@2026-07-22
        with:
          minikube-version: 1.38.1
          driver: docker
          kubernetes-version: v1.32.0
      - name: test script
        run: |
          version="$(uuidgen)"
          MINIKUBE_PROFILE="$(minikube profile list -o json | yq -r '((.valid // []) + (.invalid // []))[] | select(.Active == true) | .Name' | head -n 1)"
          if [ -z "${MINIKUBE_PROFILE}" ]; then
            echo "Could not determine the active minikube profile."
            exit 1
          fi
          IFS=$'\n' read -d '' -r -a _vals < <(yq '.wrongsecrets.image, .wrongsecrets.tag, .virtualdesktop.image, .virtualdesktop.tag' helm/wrongsecrets-ctf-party/values.yaml && printf '\0')
          WRONGSECRETS_IMAGE="${_vals[0]}"
          WRONGSECRETS_TAG="${_vals[1]}"
          WEBTOP_IMAGE="${_vals[2]}"
          WEBTOP_TAG="${_vals[3]}"
          minikube -p "${MINIKUBE_PROFILE}" image pull "${WRONGSECRETS_IMAGE}:${WRONGSECRETS_TAG}" &
          minikube -p "${MINIKUBE_PROFILE}" image pull "${WEBTOP_IMAGE}:${WEBTOP_TAG}" &
          docker build -t "local/wrongsecrets-balancer:${version}" ./wrongsecrets-balancer &
          docker build -t "local/cleaner:${version}" ./cleaner &
          wait
          minikube -p "${MINIKUBE_PROFILE}" image load "local/wrongsecrets-balancer:${version}"
          minikube -p "${MINIKUBE_PROFILE}" image load "local/cleaner:${version}"
          helm upgrade --install wrongsecrets ./helm/wrongsecrets-ctf-party \
            --set="balancer.imagePullPolicy=Never" \
            --set="wrongsecretsCleanup.imagePullPolicy=Never" \
            --set="balancer.repository=local/wrongsecrets-balancer" \
            --set="balancer.tag=${version}" \
            --set="wrongsecretsCleanup.repository=local/cleaner" \
            --set="wrongsecretsCleanup.tag=${version}"
          kubectl wait --for=condition=ready pod -l app=wrongsecrets-balancer --timeout=300s
          kubectl logs deployments/wrongsecrets-balancer -f >> pod.log &
          echo "port forwarding"
          kubectl port-forward service/wrongsecrets-balancer 3000:3000 &
          echo "Awaiting the first forward to be ready"
          sleep 10
          curl http://localhost:3000/balancer/
          echo "logs from pod to make sure:"
          cat pod.log
      - name: Show pod diagnostics on failure
        if: failure()
        run: |
          kubectl describe pods -l app=wrongsecrets-balancer
          kubectl get events --sort-by='.lastTimestamp'
