name: 'WrongSecrets CTF Party: E2E Tests'
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  e2e-test:
    name: Run Cypress E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            wrongsecrets-balancer/package-lock.json
            wrongsecrets-balancer/ui/package-lock.json
      - name: Start minikube
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 1.39.0
          driver: docker
          cpus: 2
          memory: 8000MB
          network-plugin: cni
          cni: calico
          kubernetes-version: 1.36.0
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Install yq
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
      - name: Build and deploy (non-interactive)
        run:  |
          ./build-and-deploy.sh
          kubectl get pods -A -o wide
      - name: Wait for pod to be ready
        run: |
          kubectl get deployments -A

          if ! kubectl wait --for=condition=ready pod -l app=wrongsecrets-balancer --timeout=300s; then
            echo "Deployment not available within timeout, retrying..."
            echo "=== POD DESCRIPTIONS ==="
            for pod in $(kubectl get pods \
              -l app=wrongsecrets-balancer \
              -o name 2>/dev/null); do
              echo
              echo "========================================"
              echo "=== DESCRIBE $pod ==="
              echo "========================================"
              kubectl describe "$pod" || true
            done
            echo "=== POD LOGS ==="
            for pod in $(kubectl get pods \
              -l app=wrongsecrets-balancer \
              -o name 2>/dev/null); do
              echo
              echo "========================================"
              echo "=== LOGS FOR $pod ==="
              echo "========================================"
              kubectl logs "$pod" || true
            done
            if ! kubectl wait --for=condition=ready pod -l app=wrongsecrets-balancer --timeout=300s
          fi
          kubectl get pods -A -o wide
      - name: Export admin password for Cypress
        run: echo "CYPRESS_ADMIN_PASSWORD=$(kubectl get secrets wrongsecrets-balancer-secret -o=jsonpath='{.data.adminPassword}' | base64 --decode)" >> "$GITHUB_ENV"
      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: wrongsecrets-balancer
          install: true
          start: kubectl port-forward service/wrongsecrets-balancer 3000:3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 300
          browser: chrome

      - name: Dump Kubernetes Diagnostics on Failure
        if: failure()
        run: |
          echo "=== KUBERNETES NAMESPACES ==="
          kubectl get namespaces || true
          echo "=== KUBERNETES PODS (ALL NAMESPACES) ==="
          kubectl get pods -A -o wide || true
          echo "=== KUBERNETES DEPLOYMENTS (ALL NAMESPACES) ==="
          kubectl get deployments -A -o wide || true
          echo "=== KUBERNETES EVENTS (ALL NAMESPACES) ==="
          kubectl get events -A --sort-by='.metadata.creationTimestamp' | tail -n 50 || true
          echo "=== BALANCER POD LOGS ==="
          kubectl logs -l app=wrongsecrets-balancer -A --tail=300 || true
