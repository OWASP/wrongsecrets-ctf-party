{{- $c74 := (.Values.challenges | default dict).challenge74 | default dict }}
{{- if $c74.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: wrongsecrets-ctf-party-secrets
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "wrongsecrets-ctf-party.chart" . }}
type: Opaque
stringData:
  {{- if $c74.secret }}
  challenge74: {{ $c74.secret | quote }}
  {{- else }}
  challenge74: {{ randAlphaNum 24 | quote }}
  {{- end }}
{{- end }}
